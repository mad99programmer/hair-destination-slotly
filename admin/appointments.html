            <a

                       rounded-xl text-slate-600

            >

                Dashboard

            </a>


            <a

                class="flex items-center gap-3 px-3 py-2.5
                       rounded-xl bg-plum-50

            >

                <span>▣</span>

        <!-- ADMIN -->

                <div

                           flex items-center justify-center

                    A

                <div class="leading-tight">

                        Admin

                    <p

                        Salon Manager
                    </p>

                </div>

                    ⇥
                </button>

        </div>

    </aside>


    <!-- =====================================================
         MAIN

        >

            <button
                onclick="openSidebar()"

                ☰
            </button>


            <div class="flex-1">

                <h1
                    class="font-display text-xl
                           font-bold text-slate-900"
                >
                    Appointments
                </h1>

            </div>


            <button
                onclick="loadAppointments()"
                class="flex items-center gap-2
                       bg-plum-700 hover:bg-plum-900
                       text-white px-5 py-2.5
                       rounded-xl text-sm
                       font-semibold"
            >

                ↻

                <span class="hidden sm:inline">
                    Refresh
                </span>

            </button>

        </header>


        <!-- =================================================
             CONTENT
        ================================================== -->

        <main
            class="p-4 sm:p-6 lg:p-8
                   max-w-7xl mx-auto"
        >


            <!-- COUNT -->

                    id="showing"

                           bg-slate-100

            </div>


            <!-- =================================================
                 FILTERS
            ================================================== -->

                       rounded-2xl p-6 mb-6 shadow-sm"
            >

                <div
                    class="grid grid-cols-1

                           lg:grid-cols-4 gap-5"
                >


                    <!-- STATUS -->

                    <div>

                            class="block text-xs font-bold
                                   text-slate-500 uppercase

                            Status
                        </label>


                        <select
                            id="status"
                            onchange="loadAppointments()"
                            class="w-full border
                                   border-slate-200
                                   rounded-xl py-3 px-4

                        >

                            <option value="">
                                All Statuses
                            </option>

                            <option value="booked">
                                Booked
                            </option>

                            <option value="cancelled">
                                Cancelled
                            </option>

                        </select>

                    </div>


                    <!-- FROM DATE -->

                    <div>

                        <label
                            class="block text-xs font-bold
                                   text-slate-500 uppercase
                                   tracking-wider mb-2"
                        >
                            From Date
                        </label>


                        <input
                            id="from-date"
                            type="date"
                            onchange="loadAppointments()"
                            class="w-full border
                                   border-slate-200
                                   rounded-xl py-3 px-4
                                   text-sm"
                        >

                    </div>


                    <!-- TO DATE -->

                    <div>

                        <label
                            class="block text-xs font-bold
                                   text-slate-500 uppercase
                                   tracking-wider mb-2"
                        >
                            To Date
                        </label>


                        <input
                            id="to-date"
                            type="date"
                            onchange="loadAppointments()"
                            class="w-full border
                                   border-slate-200
                                   rounded-xl py-3 px-4
                                   text-sm"
                        >

                    <!-- RESET -->

                    <div class="flex items-end">

                        <button
                            onclick="resetFilters()"

                                   hover:bg-slate-50
                                   text-slate-600

                                   text-sm font-semibold"

                            Reset Filters

                </div>

            </div>


            <!-- =================================================

            ================================================== -->

            <div

                       border-slate-100
                       rounded-3xl
                       overflow-hidden shadow-sm"
            >

                    <table

                    >

                        <thead>

                            <tr
                                class="bg-slate-50

                                       border-slate-100"
                            >

                                <th
                                    class="text-left p-5
                                           font-semibold
                                           text-xs
                                           text-slate-400
                                           uppercase"

                                <th

                                           font-semibold

                                           text-xs

                                           text-xs
                                           text-slate-400

                                    Branch
                                </th>


                                <th
                                    class="text-left p-5
                                           font-semibold
                                           text-xs
                                           text-slate-400
                                           uppercase"
                                >
                                    Date
                                </th>


                                <th
                                    class="text-left p-5
                                           font-semibold
                                           text-xs
                                           text-slate-400
                                           uppercase"
                                >
                                    Time
                                </th>


                                <th
                                    class="text-left p-5
                                           font-semibold
                                           text-xs
                                           text-slate-400
                                           uppercase"

                                </th>

                            </tr>

                        <tbody id="appointments-body">

                            <tr>

                                <td
                                    colspan="7"

                                           text-center
                                           text-slate-400"
                                >
                                    Loading appointments...
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

                        📭

                        No appointments found.

<!-- ==========================================================
     JAVASCRIPT
========================================================== -->

<script>


// ==========================================================
// AUTH CHECK
// ==========================================================

if (!requireAuth()) {

    throw new Error(
        "Authentication required"
    );

}


// ==========================================================
// SIDEBAR
// ==========================================================

function openSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .add("open");

    document
        .getElementById("backdrop")
        .classList
        .remove("hidden");

}


function closeSidebar() {

    document
        .getElementById("sidebar")
        .classList
        .remove("open");

    document
        .getElementById("backdrop")
        .classList
        .add("hidden");

}


// ==========================================================
// STATUS BADGE
// ==========================================================

function statusBadge(status) {

    if (status === "booked") {

        return `
            <span
                class="inline-flex
                       items-center
                       px-3 py-1
                       rounded-full
                       bg-green-50
                       text-green-700
                       text-xs
                       font-semibold"
            >
                ● Booked
            </span>
        `;
    }


    if (
        status === "cancelled" ||
        status === "canceled"
    ) {

        return `
            <span
                class="inline-flex
                       items-center
                       px-3 py-1
                       rounded-full
                       bg-red-50
                       text-red-600
                       text-xs
                       font-semibold"
            >
                ● Cancelled
            </span>
        `;
    }


    return `
        <span
            class="inline-flex
                   items-center
                   px-3 py-1
                   rounded-full
                   bg-slate-100
                   text-slate-600
                   text-xs
                   font-semibold"
        >
            ${status || "Unknown"}
        </span>
    `;
}


// ==========================================================
// DATE FORMAT
// ==========================================================

function formatDate(dateString) {

    if (!dateString) {

        return "-";

    }


    const parts =
        dateString.split("-");


    if (parts.length !== 3) {

        return dateString;

    }


    return (
        parts[2]
        + " "
        + getMonthName(
            Number(parts[1])
        )
        + " "
        + parts[0]
    );

}


function getMonthName(month) {

    const months = [

        "January",
        "February",
        "March",
        "April",
        "May",
        "June",
        "July",
        "August",
        "September",
        "October",
        "November",
        "December"

    ];


    return months[month - 1] || "";

}


// ==========================================================
// ESCAPE HTML
// ==========================================================

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


// ==========================================================
// LOAD APPOINTMENTS
// ==========================================================

async function loadAppointments() {

    const body =
        document.getElementById(
            "appointments-body"
        );

    const empty =
        document.getElementById(
            "empty"
        );

    const showing =
        document.getElementById(
            "showing"
        );


    empty.classList.add(
        "hidden"
    );


    body.innerHTML = `

        <tr>

            <td
                colspan="7"
                class="p-12
                       text-center
                       text-slate-400"
            >

                <div
                    class="flex
                           justify-center
                           items-center
                           gap-2"
                >

                    <svg
                        class="w-5 h-5
                               animate-spin"
                        fill="none"
                        viewBox="0 0 24 24"
                    >

                        <circle
                            class="opacity-25"
                            cx="12"
                            cy="12"
                            r="10"
                            stroke="currentColor"
                            stroke-width="4"
                        ></circle>

                        <path
                            class="opacity-75"
                            fill="currentColor"
                            d="M4 12a8 8 0 018-8V0C5.373
                               0 0 5.373 0 12h4z"
                        ></path>

                    </svg>

                    Loading appointments...

                </div>

            </td>

        </tr>

    `;


    try {


        // ==================================================
        // FILTERS
        // ==================================================

        const params =
            new URLSearchParams();


        const status =
            document
                .getElementById("status")
                .value;


        const fromDate =
            document
                .getElementById("from-date")
                .value;


        const toDate =
            document
                .getElementById("to-date")
                .value;


        if (status) {

            params.set(
                "status",
                status
            );

        }


        if (fromDate) {

            params.set(
                "from_date",
                fromDate
            );

        }


        if (toDate) {

            params.set(
                "to_date",
                toDate
            );

        }


        const query =
            params.toString();


        const url =
            query
                ? `/admin/appointments?${query}`
                : `/admin/appointments`;


        console.log(
            "Fetching appointments:",
            url
        );


        // ==================================================
        // API CALL
        // ==================================================

        const appointments =
            await apiGet(url);


        console.log(
            "Appointments response:",
            appointments
        );


        if (!appointments) {

            return;

        }


        // ==================================================
        // VALIDATE RESPONSE
        // ==================================================

        if (!Array.isArray(appointments)) {

            throw new Error(
                "API did not return an array."
            );

        }


        showing.textContent =
            `${appointments.length} appointment(s)`;


        // ==================================================
        // EMPTY RESULT
        // ==================================================

        if (
            appointments.length === 0
        ) {

            body.innerHTML = "";

            empty.classList.remove(
                "hidden"
            );

            return;

        }


        // ==================================================
        // RENDER ROWS
        // ==================================================

        body.innerHTML =
            appointments
                .map(
                    appointment => {

                        return `

                        <tr
                            class="border-b
                                   border-slate-100
                                   hover:bg-slate-50"
                        >


                            <!-- CUSTOMER -->

                            <td class="p-5">

                                <div
                                    class="font-semibold
                                           text-slate-900"
                                >
                                    ${escapeHtml(
                                        appointment.customer_name
                                    )}
                                </div>

                            </td>


                            <!-- PHONE -->

                            <td
                                class="p-5
                                       text-slate-600"
                            >

                                ${escapeHtml(
                                    appointment.customer_phone
                                )}

                            </td>


                            <!-- SERVICE -->

                            <td
                                class="p-5
                                       font-medium
                                       text-slate-800"
                            >

                                ${escapeHtml(
                                    appointment.service_name
                                )}

                            </td>


                            <!-- BRANCH -->

                            <td
                                class="p-5
                                       text-slate-700"
                            >

                                ${escapeHtml(
                                    appointment.branch_name
                                )}

                            </td>


                            <!-- DATE -->

                            <td
                                class="p-5
                                       text-slate-700"
                            >

                                ${formatDate(
                                    appointment.date
                                )}

                            </td>


                            <!-- TIME -->

                            <td
                                class="p-5
                                       font-semibold
                                       text-slate-900"
                            >

                                ${escapeHtml(
                                    appointment.time
                                )}

                            </td>


                            <!-- STATUS -->

                            <td class="p-5">

                                ${statusBadge(
                                    appointment.status
                                )}

                            </td>


                        </tr>

                        `;

                    }
                )
                .join("");


    }

    catch (error) {


        console.error(
            "Appointments loading error:",
            error
        );


        showing.textContent =
            "Unable to load";


        body.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="p-12
                           text-center"
                >

                    <div
                        class="text-red-500
                               font-semibold
                               mb-2"
                    >
                        Failed to load appointments
                    </div>

                    <div
                        class="text-sm
                               text-slate-400"
                    >
                        ${escapeHtml(
                            error.message
                        )}
                    </div>

                </td>

            </tr>

        `;

    }

}


// ==========================================================
// RESET FILTERS
// ==========================================================

function resetFilters() {

    document
        .getElementById("status")
        .value = "";


    document
        .getElementById("from-date")
        .value = "";


    document
        .getElementById("to-date")
        .value = "";


    loadAppointments();

}


// ==========================================================
// LOAD ON PAGE OPEN
// ==========================================================

loadAppointments();


</script>


</body>

</html>
